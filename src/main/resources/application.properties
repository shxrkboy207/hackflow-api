spring.application.name=hackflow-api

# Só aceita conexões do próprio computador (o Vite usa o proxy local).
# Para abrir para a rede, troque por 0.0.0.0 (e só faça isso depois de ter login).
server.address=127.0.0.1
server.port=8080

# ---------- SQLite ----------
# O arquivo hackflow.db é criado na pasta de onde o programa é executado.
spring.datasource.url=jdbc:sqlite:hackflow.db
spring.datasource.driver-class-name=org.sqlite.JDBC
# SQLite grava uma conexão por vez: um pool de 1 conexão evita o erro "database is locked".
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.minimum-idle=1
# No SQLite as chaves estrangeiras vêm desligadas; isto liga em cada conexão.
spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys = ON
# Executa o schema.sql (CREATE TABLE IF NOT EXISTS) toda vez que o servidor sobe.
spring.sql.init.mode=always

# ---------- Segurança básica ----------
# Rejeita JSON com campos que a API não conhece.
spring.jackson.deserialization.fail-on-unknown-properties=true
# Não devolve mensagens internas nem stack trace nas respostas de erro.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# ---------- HackFlow ----------
# Origens (separadas por vírgula) que podem chamar a API direto do navegador.
# Com o proxy do Vite isto nem é usado; fica pronto para quando o front estiver em outro endereço.
hackflow.cors.origens=http://localhost:5173,http://127.0.0.1:5173
# Cria equipes e avisos de EXEMPLO se o banco estiver vazio (contas de exemplo não têm senha utilizável).
# Deixe false para trabalhar só com dados reais.
hackflow.seed=false

# ---------- Login ----------
# Duração da sessão (cookie HttpOnly) em horas.
hackflow.sessao.horas=12
# true = o cookie só viaja por HTTPS. Mude para true quando o site estiver em HTTPS.
hackflow.cookie.seguro=false
